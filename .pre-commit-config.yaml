# Checks that run on every commit, and in CI on every push (`uv run pre-commit run --all-files`).
#
#   uv sync                          # installs pre-commit with the other development tools
#   uv run pre-commit install        # once per clone: checks staged files and the commit message
#
# Every hook is pinned to a commit; Dependabot keeps the pins current (.github/dependabot.yml).
# mypy runs from the project environment so it sees the same dependency versions as the tests.
default_install_hook_types: [pre-commit, commit-msg]
default_stages: [pre-commit]
minimum_pre_commit_version: "4.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: check-added-large-files
      - id: check-case-conflict
      - id: check-executables-have-shebangs
      - id: check-shebang-scripts-are-executable
        exclude: ^deploy/nftables/  # rule files loaded with `nft -f`; their shebang is documentation
      - id: check-merge-conflict
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: detect-private-key
      - id: end-of-file-fixer
      - id: mixed-line-ending
        args: [--fix=lf]
      - id: trailing-whitespace
        args: [--markdown-linebreak-ext=md]

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: ef6cf06c079dd6b299dfc720b0f14400c9d168e1  # frozen: v0.17.5
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/shellcheck-py/shellcheck-py
    rev: 745eface02aef23e168a8afb6b5737818efbea95  # frozen: v0.11.0.1
    hooks:
      - id: shellcheck

  - repo: https://github.com/biomejs/pre-commit
    rev: 2a24170fd6adbd6fb1463868533368fe9c01a04d  # frozen: v2.6.6
    hooks:
      - id: biome-check  # the monitor page only (biome.json)
        additional_dependencies: ["@biomejs/biome@2.6.6"]

  - repo: local
    hooks:
      - id: mypy
        name: mypy
        entry: uv run --frozen mypy
        language: system
        files: ^(src/|tests/|pyproject\.toml$)
        types_or: [python, toml]
        pass_filenames: false
        require_serial: true

  # GitHub Actions workflows: correctness (actionlint) and security (zizmor).
  - repo: https://github.com/rhysd/actionlint
    rev: 914e7df21a07ef503a81201c76d2b11c789d3fca  # frozen: v1.7.12
    hooks:
      - id: actionlint

  - repo: https://github.com/zizmorcore/zizmor-pre-commit
    rev: 06a39750ec31860bb44f2acf67182c40016cd1e7  # frozen: v1.32.0
    hooks:
      - id: zizmor

  # API keys and private keys must never be committed (settings/ holds real ones locally).
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks

  # Commit messages: Conventional Commits, e.g. "fix(reading): ..." (see CONTRIBUTING.md).
  - repo: https://github.com/compilerla/conventional-pre-commit
    rev: 33b50eb042bee26eac0ee96ad84aa9c1b4dccdd8  # frozen: v4.5.0
    hooks:
      - id: conventional-pre-commit
        stages: [commit-msg]
        args: [--verbose, build, chore, ci, docs, feat, fix, perf, refactor, revert, style, test]
