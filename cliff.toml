# CHANGELOG.md and release notes from the Conventional Commit messages (https://git-cliff.org).
#   uvx git-cliff@2.14.2 --unreleased                      # what the next release will list
#   uvx git-cliff@2.14.2 --tag vX.Y.Z --output CHANGELOG.md   # before tagging a release (CONTRIBUTING.md)

[changelog]
header = """
# Changelog

Notable changes, generated from the Conventional Commit messages with [git-cliff](https://git-cliff.org).
Versions follow [Semantic Versioning](https://semver.org); before 1.0.0, a minor version may change behavior.
"""
body = """
{% if version %}\
## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
## [Unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group | striptags | trim | upper_first }}
{% for commit in commits %}
- {% if commit.breaking %}**Breaking:** {% endif %}{% if commit.scope %}{{ commit.scope }}: {% endif %}{{ commit.message | upper_first }}\
{% endfor %}
{% endfor %}
"""
footer = """
## Before 0.1.0

The project was built before it used Conventional Commits; its earlier history is in `git log`."""
trim = false  # keep the blank lines between the header, the versions, and the footer

[git]
# Commits listed in .git-blame-ignore-revs (pure reformatting) are left out by git-cliff itself.
conventional_commits = true
filter_unconventional = true
protect_breaking_commits = true
tag_pattern = "v[0-9]+\\.[0-9]+\\.[0-9]+"
sort_commits = "oldest"
commit_parsers = [
    { message = "^feat", group = "<!-- 0 -->Features" },
    { message = "^fix", group = "<!-- 1 -->Bug fixes" },
    { message = "^perf", group = "<!-- 2 -->Performance" },
    { message = "^refactor", group = "<!-- 3 -->Refactoring" },
    { message = "^docs", group = "<!-- 4 -->Documentation" },
    { message = "^test", group = "<!-- 5 -->Tests" },
    { message = "^(build|ci)", group = "<!-- 6 -->Build and CI" },
    { message = "^style", group = "<!-- 7 -->Code style" },
    { message = "^revert", group = "<!-- 8 -->Reverts" },
    { message = "^chore", skip = true },
]
