# Example research topics. Copy to settings/topics.toml (gitignored), edit, then run deploy/apply_settings.sh.
# Add one [[topics]] block per research interest. All topics are active and every one is considered in each run.
#
# A topic can be defined by keywords, by seed papers, or by both:
#   question           PRIVATE. A full sentence for the local model only; never sent to any paper provider.
#                      Optional for a seeds-only topic.
#   public_queries     Search terms the collector MAY send to arXiv / OpenAlex.
#   arxiv_categories   Public subject categories to watch. A seeds-only topic searches these and ranks the results
#                      against its seeds locally.
#   zotero_collections Zotero collection keys (8 characters, from the collection URL zotero.org/<user>/collections/<KEY>).
#                      Only items directly in the collection are used; list subcollections separately.
#   csl_json_files     CSL JSON exports (Zotero: right-click a collection -> Export Collection... -> CSL JSON). Put them
#                      in settings/seeds/ and list them as "seeds/<file>.json". Same standing as a Zotero collection.

# Keywords and seeds together.
[[topics]]
id = "team-safety"
question = "Can a runtime monitor reject a joint robot plan before it blocks a human exit?"
public_queries = ["multi-robot runtime assurance", "multi-agent plan monitoring",
                  "runtime verification mobile robots"]
arxiv_categories = ["cs.RO", "cs.MA", "cs.LO"]
zotero_collections = []          # e.g. ["ABCD2345"]
csl_json_files = []              # e.g. ["seeds/team-safety.json"]

# Seeds only: no question; the topic is defined by the papers in its collection.
# [[topics]]
# id = "library-verification"
# arxiv_categories = ["cs.LO", "cs.PL"]
# zotero_collections = ["EFGH6789"]
