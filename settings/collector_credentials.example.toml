# Provider API keys for the collector. Copy to settings/collector_credentials.toml (gitignored), fill in, then:
#     chmod 600 settings/collector_credentials.toml && deploy/apply_settings.sh
# The script installs it as <home>/credentials/collector.toml, owned by paperwatch-collector with mode 0600: only
# the collector can read it, and the key never appears in config.toml, topics.toml, logs, or git.
# NEVER put a real key in this example file: it is committed to git.

[zotero]
api_key = "YOUR-READ-ONLY-ZOTERO-KEY"   # zotero.org/settings/keys: read-only library access; leave notes access off
library_type = "user"                    # "user" for your own library, "group" for a group library
library_id = "12345678"                  # your numeric "User ID" from the same page (or the group id)

# [openalex]
# api_key = "..."                        # optional for search; needed for the OpenAlex full-text route (part 5)
