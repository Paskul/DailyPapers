# READ-ONLY provider access rules for the collector (plan part 3).
#
# This file ships inside the paperwatch package. In deployment the package directory is root-owned, so no service
# account can widen network access, and config.toml cannot override anything here. `paperwatch access-check`
# warns if the running account can write this file.
#
# The collector can make only the requests described here:
#   * HTTPS GET only, to the `host` of an operation, on a path that fully matches `path_pattern` (a Python regular
#     expression over the percent-encoded path), with query parameter NAMES from `query_parameters` only.
#   * Extra request headers (beyond the fixed ones and the credential) only from `request_headers`, e.g. a
#     conditional "only if changed" header. Only the response headers named in `response_headers` reach the caller.
#   * Redirects are refused unless the target is HTTPS on a host listed in that operation's `redirect_hosts`.
#     Provider credentials are attached only on the operation's own host and are dropped on any host change.
#   * Every connection target is checked against private, loopback, link-local, and reserved addresses, on every hop.
#   * Every hop counts against the provider's daily request budget and minimum spacing (shared across processes).
#   * Responses are bounded: bytes on the wire, bytes after decompression, and total time per hop.
#
# Adding a provider or an operation is a code change: the request builder in paperwatch/network/provider_requests.py
# must construct the URL from validated ids, and this file must allow exactly that URL shape.

[defaults]
max_redirect_hops = 2
connect_timeout_seconds = 10.0
outage_backoff_initial_seconds = 300      # a provider-wide outage pauses that provider, doubling up to the maximum
outage_backoff_max_seconds = 21600

# ---- arXiv: legacy API (search, metadata) and versioned PDFs -----------------------------------------------------
[providers.arxiv]
credential_kind = "none"
daily_request_budget = 2000
minimum_seconds_between_requests = 3.0    # arXiv API terms: no more than one request every three seconds
search_page_size = 100

[providers.arxiv.operations.search]
host = "export.arxiv.org"
path_pattern = '/api/query'
query_parameters = ["search_query", "start", "max_results", "sortBy", "sortOrder"]
content_types = ["application/atom+xml", "application/xml", "text/xml"]
max_response_bytes = 10_000_000
max_decompressed_bytes = 50_000_000
total_timeout_seconds = 90.0

[providers.arxiv.operations.get_work]
host = "export.arxiv.org"
path_pattern = '/api/query'
query_parameters = ["id_list"]
content_types = ["application/atom+xml", "application/xml", "text/xml"]
max_response_bytes = 2_000_000
max_decompressed_bytes = 10_000_000
total_timeout_seconds = 60.0

[providers.arxiv.operations.get_text]
host = "arxiv.org"
path_pattern = '/pdf/([0-9]{4}\.[0-9]{4,5}|[a-z][a-z-]*(\.[A-Z]{2})?/[0-9]{7})v[1-9][0-9]*'
query_parameters = []
content_types = ["application/pdf"]
max_response_bytes = 60_000_000
max_decompressed_bytes = 60_000_000
total_timeout_seconds = 300.0

# ---- OpenAlex: works API (search, metadata) and the content API (full text) ------------------------------------------
[providers.openalex]
credential_kind = "query_parameter"       # optional key from the credentials file, sent as ?api_key=...
credential_name = "api_key"
credential_required = false
daily_request_budget = 5000
minimum_seconds_between_requests = 0.2    # OpenAlex allows about 10 requests per second
search_page_size = 100

[providers.openalex.operations.search]
host = "api.openalex.org"
path_pattern = '/works'
query_parameters = ["search", "filter", "per-page", "cursor", "sort", "select"]
content_types = ["application/json"]
max_response_bytes = 10_000_000
max_decompressed_bytes = 50_000_000
total_timeout_seconds = 90.0

[providers.openalex.operations.get_work]
host = "api.openalex.org"
path_pattern = '/works/(W[0-9]+|doi:10\.[0-9]{4,9}/[A-Za-z0-9._~%/-]+)'
query_parameters = ["select"]
content_types = ["application/json"]
max_response_bytes = 2_000_000
max_decompressed_bytes = 10_000_000
total_timeout_seconds = 60.0

[providers.openalex.operations.get_text]
host = "content.openalex.org"
path_pattern = '/works/W[0-9]+\.pdf'
query_parameters = []
content_types = ["application/pdf"]
max_response_bytes = 60_000_000
max_decompressed_bytes = 60_000_000
total_timeout_seconds = 300.0
credential_required = true                # the content API needs a key; without one this route is skipped

# ---- Zotero Web API: seed items of approved collections (read-only key) -----------------------------------------
[providers.zotero]
credential_kind = "header"
credential_name = "Zotero-API-Key"
credential_required = true
fixed_headers = { "Zotero-API-Version" = "3" }
daily_request_budget = 500
minimum_seconds_between_requests = 1.0
search_page_size = 100

[providers.zotero.operations.list_seed_items]
host = "api.zotero.org"
path_pattern = '/(users|groups)/[0-9]{1,12}/collections/[A-Z0-9]{8}/items/top'
query_parameters = ["format", "include", "itemType", "start", "limit", "sort", "direction"]
request_headers = ["If-Modified-Since-Version"]          # 304 when the library has not changed since the last sync
response_headers = ["Last-Modified-Version", "Total-Results"]
content_types = ["application/json"]
max_response_bytes = 10_000_000
max_decompressed_bytes = 50_000_000
total_timeout_seconds = 90.0
