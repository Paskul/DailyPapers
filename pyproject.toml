[project]
name = "paperwatch"
dynamic = ["version"]  # read from src/paperwatch/__init__.py (the one place the version is written)
description = "Local, autonomous daily paper monitor: collect, screen, review with a local llama.cpp model, and publish one Markdown report per day."
readme = "README.md"
license = "MIT"
authors = [{ name = "Pascal Sikorski" }]
requires-python = ">=3.12"
keywords = ["arxiv", "openalex", "zotero", "research-papers", "literature-monitoring", "llama-cpp", "local-llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Science/Research",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Scientific/Engineering :: Information Analysis",
    "Typing :: Typed",
]
dependencies = [
    "httpx>=0.27",       # small HTTP client with explicit timeouts (model server now, providers later)
    "jsonschema>=4.22",  # validates every model answer against its role's output schema
    "numpy>=2.5.5",
    "onnxruntime>=1.32.0",
    "tokenizers>=0.23.3",
]

[project.urls]
Homepage = "https://github.com/Paskul/DailyPapers"
Issues = "https://github.com/Paskul/DailyPapers/issues"
Changelog = "https://github.com/Paskul/DailyPapers/blob/main/CHANGELOG.md"
Security = "https://github.com/Paskul/DailyPapers/security/policy"

[project.scripts]
paperwatch = "paperwatch.cli:main"

[dependency-groups]
# Development only: never installed by deploy/install_application.sh (it exports the lockfile with --no-dev).
dev = [
    "pytest>=8",
    "pytest-cov>=7.1",     # coverage, including the CLI runs the tests start as subprocesses
    "mypy>=2.4",           # type checking (strict for src/, see [tool.mypy])
    "types-jsonschema>=4.26",
    "pre-commit>=4.7",     # runs every check in .pre-commit-config.yaml before each commit and in CI
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.version]
path = "src/paperwatch/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["src/paperwatch"]

# ---- tests ---------------------------------------------------------------------------------------------------------

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["live_model: talks to the real local llama.cpp server (set PAPERWATCH_LIVE_MODEL=1)"]

[tool.coverage.run]
source = ["paperwatch"]
branch = true
patch = ["subprocess"]  # also measure the `paperwatch` CLI processes the end-to-end tests start

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---- lint and format (ruff; run through pre-commit) ----------------------------------------------------------------

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.per-file-target-version]
# Runs inside the extractor image with Debian's python3 (3.11), not the application's Python.
"deploy/extractor/extract_text.py" = "py311"

[tool.ruff.lint]
# On top of ruff's defaults (pyflakes, pycodestyle errors, bugbear, pyupgrade, import sorting, and more):
extend-select = [
    "S",    # flake8-bandit: subprocess, temporary files, unsafe deserialization, weak randomness, ...
    "DTZ",  # naive datetimes: every stored and compared time in paperwatch is timezone-aware UTC
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = [
    "S101",  # assert is how pytest checks
    "S104",  # the monitor tests check that all-interfaces addresses are refused
    "S105",  # hard-coded "passwords": test keys and placeholders
    "S106",
    "S108",  # fixed /tmp paths inside test doubles
    "S311",  # pseudo-random data for the hostile-model tests (not security relevant)
    "S603",  # the tests start the CLI and helper programs on purpose
    "S605",  # ... and check that the egress guard blocks a shell launch
    "S607",
]

# ---- types (mypy) --------------------------------------------------------------------------------------------------

[tool.mypy]
python_version = "3.12"
files = ["src", "tests"]
mypy_path = "src"
# Everywhere, the tests included:
check_untyped_defs = true
strict_equality = true
warn_redundant_casts = true
warn_unused_ignores = true
warn_unused_configs = true

[[tool.mypy.overrides]]
# The application itself: everything `mypy --strict` checks.
module = ["paperwatch", "paperwatch.*"]
disallow_any_generics = true
disallow_incomplete_defs = true
disallow_subclassing_any = true
disallow_untyped_calls = true
disallow_untyped_decorators = true
disallow_untyped_defs = true
extra_checks = true
implicit_reexport = false
warn_return_any = true

[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]  # ships no type information
ignore_missing_imports = true
